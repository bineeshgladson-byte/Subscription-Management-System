                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Quotation templates]
      summary: Deactivate a template
      description: 'Roles: admin.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/NotFound' }

  /discounts:
    get:
      tags: [Discounts]
      summary: List discount rules
      description: 'Roles: admin.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: q, in: query, description: name or code, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [subscription, product] } }
        - { name: state, in: query, schema: { type: string, enum: [active, scheduled, expired, used_up, inactive] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Discount' } }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Discounts]
      summary: Create a discount rule
      description: |
        Roles: admin ("Only the admin can create discount rules"). Eligible discounts are applied automatically by
        the pricing engine: the best product discount per line, then the best subscription-wide discount; they
        stop applying after ends_on or once usage_count reaches max_usage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Discount' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /discounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Discounts]
      summary: Get a discount
      description: 'Roles: admin.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Discount' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Discounts]
      summary: Edit a discount
      description: 'Roles: admin. "" clears code / min_purchase_amount / ends_on; 0 clears min_quantity / max_usage. max_usage can''t go below usage_count.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Discount' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Discounts]
      summary: Deactivate a discount (usage history is kept)
      description: 'Roles: admin.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Discount' }
        '404': { $ref: '#/components/responses/NotFound' }

  /discounts/{id}/usages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Discounts]
      summary: Where a discount was applied
      description: 'Roles: admin. Rows are created by invoice generation (A9).'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/DiscountUsage' } }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pricing/preview:
    post:
      tags: [Discounts]
      summary: Price catalogue lines with today's taxes and discounts
      description: |
        Roles: admin, staff. Pure calculation, nothing is saved. Order: line subtotal → best product discount →
        best subscription discount (spread over lines) → tax per line (rounded half-up). Example: 10 × Odoo Brand
        (1559) with "10% off orders over 10,000" and GST 18% → total 16556.58.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricePreviewInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PricePreview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      description: 'Roles: admin, staff.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: customer_id, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } }
                      meta: { $ref: '#/components/schemas/PageMeta' }

  /invoices/{id}/payments:
    post:
      tags: [Payments]
      summary: Record a payment against an invoice
      description: 'Roles: admin, staff. Send an Idempotency-Key header per form submit.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordPaymentRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          payment: { $ref: '#/components/schemas/Payment' }
                          invoice: { $ref: '#/components/schemas/InvoiceSummary' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: KPI tiles
      description: 'Roles: admin (all fields), staff (financial fields omitted).'
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardSummary' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Sort: { name: sort, in: query, description: 'column, prefix with - for descending', schema: { type: string, example: -created_at } }

  responses:
    Message:
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: NOT_FOUND, message: staff member not found } }
    EmptyOK:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: VALIDATION_ERROR, message: Some fields are invalid, details: { password: must include an uppercase letter } } }
    Unauthenticated:
      description: Missing/invalid token or wrong credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: UNAUTHENTICATED, message: invalid email or password } }
    Forbidden:
      description: Wrong role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: FORBIDDEN, message: you do not have access to this resource } }
    Conflict:
      description: Duplicate or illegal state change
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: CONFLICT, message: email already registered } }
    BusinessRule:
      description: A business rule was broken
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example: { success: false, error: { code: BUSINESS_RULE, message: payment exceeds amount due, details: { rule: AMOUNT_EXCEEDS_DUE } } }

  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: '999.00'

    Envelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, example: true }
        data: {}
        meta: {}

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, INVALID_STATE, BUSINESS_RULE, NOT_IMPLEMENTED, INTERNAL_ERROR] }
            message: { type: string }
            details: { type: object, additionalProperties: { type: string } }

    PageMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total: { type: integer, example: 134 }

    Role: { type: string, enum: [admin, staff, customer] }

    RegisterRequest:
      type: object
      required: [full_name, email, password]
      properties:
        full_name: { type: string, example: Rahul Sharma }
        email: { type: string, format: email, example: rahul@example.in }
        password: { type: string, description: '9+ chars, upper, lower, special', example: 'Brightloop#2026' }
        phone: { type: string, example: '9876543210' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@brightloop.local }
        password: { type: string, example: 'Admin#Brightloop1' }

    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 4 }
        email: { type: string, example: priya@brightloop.in }
        full_name: { type: string, example: Priya Nair }
        role: { $ref: '#/components/schemas/Role' }
        customer_id: { type: integer, format: int64, description: 'customers only' }
        profile: { $ref: '#/components/schemas/CustomerProfile' }

    CustomerProfile:
      type: object
      description: customers only
      properties:
        phone: { type: string, nullable: true }
        company_name: { type: string, nullable: true }
        billing_address: { type: string, nullable: true }
        gstin: { type: string, nullable: true, example: 29ABCDE1234F1Z5 }

    UpdateProfileRequest:
      type: object
      properties:
        full_name: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, maxLength: 20, description: customers only }
        company_name: { type: string, maxLength: 150, description: customers only }
        billing_address: { type: string, maxLength: 500, description: customers only }
        gstin: { type: string, description: 'customers only; Indian GSTIN, stored upper-case' }

    Staff:
      type: object
      properties:
        id: { type: integer, format: int64, example: 4 }
        email: { type: string, example: priya@brightloop.in }
        full_name: { type: string, example: Priya Nair }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    LoginResponse:
      type: object
      properties:
        access_token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    CustomerInput:
      type: object
      required: [name, email]
      description: 'POST requires name and email; PUT accepts any subset.'
      properties:
        name: { type: string, minLength: 2, maxLength: 150, example: Acme Pvt Ltd }
        email: { type: string, format: email, example: accounts@acme.in }
        phone: { type: string, example: '+91 98765 43210', description: '7-15 digits; + spaces - ( ) allowed' }
        company_name: { type: string, maxLength: 150 }
        billing_address: { type: string, maxLength: 500 }
        gstin: { type: string, example: 29ABCDE1234F1Z5, description: 'Indian GSTIN, stored upper-case' }

    Customer:
      type: object
      properties:
        id: { type: integer, format: int64, example: 18 }
        name: { type: string, example: Acme Pvt Ltd }
        email: { type: string, example: accounts@acme.in }
        phone: { type: string, nullable: true }
        company_name: { type: string, nullable: true }
        billing_address: { type: string, nullable: true }
        gstin: { type: string, nullable: true }
        has_login: { type: boolean, description: 'true once the customer has signed up' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            stats:
              type: object
              properties:
                active_subscriptions: { type: integer, description: active + paused }
                total_subscriptions: { type: integer }
                open_invoices: { type: integer, description: confirmed and not fully paid }
                overdue_invoices: { type: integer }
                amount_due: { $ref: '#/components/schemas/Money' }

    Tax:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: GST 18% }
        rate: { type: string, example: '18.00' }
        is_active: { type: boolean }
        products_using: { type: integer, description: active products with this as their default tax }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VariantInput:
      type: object
      required: [attribute, name]
      properties:
        attribute: { type: string, example: Brand }
        name: { type: string, example: Odoo Brand }
        extra_price: { type: string, example: '560.00', description: 'added to sales_price; may be negative; default 0' }
        sku: { type: string, example: ODOO-SEAT }

    VariantUpdate:
      type: object
      properties:
        attribute: { type: string }
        name: { type: string }
        extra_price: { type: string }
        sku: { type: string, description: '"" removes it' }
        is_active: { type: boolean }

    Variant:
      type: object
      properties:
        id: { type: integer, format: int64, example: 12 }
        attribute: { type: string, example: Brand }
        name: { type: string, example: Odoo Brand }
        extra_price: { $ref: '#/components/schemas/Money' }
        price: { $ref: '#/components/schemas/Money' }
        sku: { type: string, nullable: true }
        is_active: { type: boolean }

    ProductInput:
      type: object
      required: [name, product_type, sales_price]
      properties:
        name: { type: string, example: Software Subscription }
        product_type: { type: string, enum: [software, service, addon] }
        sales_price: { $ref: '#/components/schemas/Money' }
        cost_price: { $ref: '#/components/schemas/Money' }
        description: { type: string, description: notes }
        tax_id: { type: integer, format: int64, description: must be an active tax }
        variants: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/VariantInput' } }

    ProductUpdate:
      type: object
      properties:
        name: { type: string }
        product_type: { type: string, enum: [software, service, addon] }
        sales_price: { $ref: '#/components/schemas/Money' }
        cost_price: { $ref: '#/components/schemas/Money' }
        description: { type: string }
        tax_id: { type: integer, format: int64, description: '0 removes the default tax' }
        status: { type: string, enum: [active, archived] }

    Product:
      type: object
      properties:
        id: { type: integer, format: int64, example: 7 }
        name: { type: string, example: Software Subscription }
        product_type: { type: string, enum: [software, service, addon] }
        sales_price: { $ref: '#/components/schemas/Money' }
        cost_price: { type: string, nullable: true, description: 'admin only (null for staff)' }
        margin: { type: string, nullable: true, description: 'sales_price - cost_price, admin only' }
        description: { type: string, nullable: true }
        tax:
          type: object
          nullable: true
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            rate: { type: string, example: '18.00' }
        status: { type: string, enum: [active, archived] }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanLineInput:
      type: object
      required: [product_id]
      properties:
        product_id: { type: integer, format: int64 }
        variant_id: { type: integer, format: int64, description: must belong to the product and be active }
        quantity: { type: integer, minimum: 1, default: 1 }
        price_override: { type: string, description: 'replaces the catalogue unit price for this line' }

    PlanInput:
      type: object
      required: [name, billing_period, products]
      properties:
        name: { type: string, example: Starter Monthly }
        description: { type: string }
        billing_period: { type: string, enum: [daily, weekly, monthly, yearly] }
        billing_interval: { type: integer, minimum: 1, maximum: 99, default: 1, description: 'every N periods' }
        min_quantity: { type: integer, minimum: 1, default: 1 }
        available_from: { type: string, format: date, description: 'default today' }
        available_until: { type: string, format: date }
        auto_close_enabled: { type: boolean, default: false }
        auto_close_after_cycles: { type: integer, minimum: 1, description: 'required when auto_close_enabled' }
        is_pausable: { type: boolean, default: false }
        is_closable: { type: boolean, default: true, description: early closure allowed }
        is_renewable: { type: boolean, default: true }
        products: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/PlanLineInput' } }

    PlanUpdate:
      type: object
      description: 'Any subset of PlanInput fields. products replaces all lines.'
      properties:
        name: { type: string }
        description: { type: string }
        billing_period: { type: string, enum: [daily, weekly, monthly, yearly] }
        billing_interval: { type: integer }
        min_quantity: { type: integer }
        available_from: { type: string, format: date }
        available_until: { type: string, description: 'date, or "" to remove' }
        auto_close_enabled: { type: boolean }
        auto_close_after_cycles: { type: integer, description: '0 removes it' }
        is_pausable: { type: boolean }
        is_closable: { type: boolean }
        is_renewable: { type: boolean }
        products: { type: array, items: { $ref: '#/components/schemas/PlanLineInput' } }

    Plan:
      type: object
      properties:
        id: { type: integer, format: int64, example: 3 }
        name: { type: string, example: Starter Monthly }
        description: { type: string, nullable: true }
        price: { $ref: '#/components/schemas/Money' }
        billing_period: { type: string, enum: [daily, weekly, monthly, yearly] }
        billing_interval: { type: integer, example: 1 }
        billing_label: { type: string, example: Every 3 months }
        min_quantity: { type: integer, example: 1 }
        available_from: { type: string, format: date }
        available_until: { type: string, format: date, nullable: true }
        is_available_now: { type: boolean }
        auto_close_enabled: { type: boolean }
        auto_close_after_cycles: { type: integer, nullable: true }
        is_pausable: { type: boolean }
        is_closable: { type: boolean }
        is_renewable: { type: boolean }
        status: { type: string, enum: [active, archived] }
        products:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              product_id: { type: integer, format: int64 }
              product_name: { type: string }
              variant_id: { type: integer, format: int64, nullable: true }
              variant_name: { type: string, nullable: true }
              quantity: { type: integer }
              price_override: { type: string, nullable: true }
              unit_price: { $ref: '#/components/schemas/Money' }
              line_total: { $ref: '#/components/schemas/Money' }
        active_subscriptions: { type: integer, description: 'admin/staff only (absent for customers)' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TemplateInput:
      type: object
      properties:
        name: { type: string, example: Standard SME offer }
        plan_id: { type: integer, format: int64 }
        validity_days: { type: integer, minimum: 1, maximum: 365, default: 15 }
        payment_terms_days: { type: integer, minimum: 0, maximum: 365, default: 15 }
        terms: { type: string }
        is_active: { type: boolean, description: PUT only }
        lines:
          type: array
          items:
            type: object
            required: [product_id]
            properties:
              product_id: { type: integer, format: int64 }
              variant_id: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1, default: 1 }

    Template:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        plan:
          type: object
          nullable: true
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            billing_label: { type: string }
            price: { $ref: '#/components/schemas/Money' }
            status: { type: string }
        validity_days: { type: integer }
        payment_terms_days: { type: integer }
        terms: { type: string, nullable: true }
        is_active: { type: boolean }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              product_id: { type: integer, format: int64 }
              product_name: { type: string }
              variant_id: { type: integer, format: int64, nullable: true }
              variant_name: { type: string, nullable: true }
              quantity: { type: integer }
              unit_price: { $ref: '#/components/schemas/Money' }
              line_total: { $ref: '#/components/schemas/Money' }
        estimated_total: { $ref: '#/components/schemas/Money' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DiscountInput:
      type: object
      description: 'POST requires name, discount_type, value, scope (+ product_ids for product scope).'
      properties:
        name: { type: string, example: '10% off orders over 10,000' }
        code: { type: string, description: 'optional label, stored upper-case' }
        discount_type: { type: string, enum: [fixed, percentage] }
        value: { type: string, example: '10', description: 'amount, or percent ≤ 100' }
        scope: { type: string, enum: [subscription, product] }
        product_ids: { type: array, items: { type: integer, format: int64 } }
        min_purchase_amount: { type: string, example: '10000.00' }
        min_quantity: { type: integer, minimum: 1 }
        starts_on: { type: string, format: date, description: default today }
        ends_on: { type: string, format: date }
        max_usage: { type: integer, minimum: 1 }
        is_active: { type: boolean, description: PUT only }

    Discount:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string, nullable: true }
        discount_type: { type: string, enum: [fixed, percentage] }
        value: { $ref: '#/components/schemas/Money' }
        label: { type: string, example: 10% off }
        scope: { type: string, enum: [subscription, product] }
        products: { type: array, items: { type: object, properties: { id: { type: integer, format: int64 }, name: { type: string } } } }
        min_purchase_amount: { type: string, nullable: true }
        min_quantity: { type: integer, nullable: true }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date, nullable: true }
        max_usage: { type: integer, nullable: true }
        usage_count: { type: integer }
        remaining_uses: { type: integer, nullable: true }
        is_active: { type: boolean }
        state: { type: string, enum: [active, scheduled, expired, used_up, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DiscountUsage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        invoice_id: { type: integer, format: int64 }
        invoice_number: { type: string, nullable: true }
        customer_id: { type: integer, format: int64 }
        customer_name: { type: string, nullable: true }
        amount: { $ref: '#/components/schemas/Money' }
        created_at: { type: string, format: date-time }

    PricePreviewInput:
      type: object
      required: [lines]
      properties:
        date: { type: string, format: date, description: "which day's discounts apply (default today)" }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id]
            properties:
              product_id: { type: integer, format: int64 }
              variant_id: { type: integer, format: int64 }
              quantity: { type: integer, minimum: 1, default: 1 }
              unit_price: { type: string, description: override the catalogue price }

    PricePreview:
      type: object
      properties:
        date: { type: string, format: date }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount_total: { $ref: '#/components/schemas/Money' }
        tax_total: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        discounts: { type: array, items: { type: object, properties: { discount_id: { type: integer, format: int64 }, name: { type: string }, scope: { type: string }, amount: { $ref: '#/components/schemas/Money' } } } }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer, format: int64 }
              description: { type: string }
              quantity: { type: integer }
              unit_price: { $ref: '#/components/schemas/Money' }
              subtotal: { $ref: '#/components/schemas/Money' }
              product_discount: { $ref: '#/components/schemas/Money' }
              product_discount_name: { type: string, nullable: true }
              subscription_discount: { $ref: '#/components/schemas/Money' }
              tax_rate: { type: string }
              tax_amount: { $ref: '#/components/schemas/Money' }
              total: { $ref: '#/components/schemas/Money' }

    InvoiceStatus: { type: string, enum: [draft, confirmed, paid, cancelled] }

    InvoiceSummary:
      type: object
      properties:
        id: { type: integer, format: int64, example: 140 }
        invoice_number: { type: string, example: INV/2026/00042 }
        customer:
          type: object
          properties:
            id: { type: integer, format: int64 }
            name: { type: string, example: Rahul Sharma }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        total: { $ref: '#/components/schemas/Money' }
        amount_paid: { $ref: '#/components/schemas/Money' }
        amount_due: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        payment_status: { type: string, enum: [unpaid, partial, paid] }
        is_overdue: { type: boolean }
        days_overdue: { type: integer }

    RecordPaymentRequest:
      type: object
      required: [method, amount, payment_date]
      properties:
        method: { type: string, enum: [upi, bank_transfer, card, cash] }
        amount: { $ref: '#/components/schemas/Money' }
        payment_date: { type: string, format: date }
        reference: { type: string, example: UTR4415298811 }
        notes: { type: string }

    Payment:
      type: object
      properties:
        id: { type: integer, format: int64, example: 77 }
        payment_number: { type: string, example: PAY/2026/00061 }
        invoice_id: { type: integer, format: int64 }
        method: { type: string, enum: [upi, bank_transfer, card, cash] }
        amount: { $ref: '#/components/schemas/Money' }
        payment_date: { type: string, format: date }
        status: { type: string, enum: [pending, completed, failed, refunded] }

    DashboardSummary:
      type: object
      properties:
        total_customers: { type: integer, example: 412 }
        active_subscriptions: { type: integer, example: 368 }
        total_subscriptions: { type: integer, example: 455 }
        mrr: { $ref: '#/components/schemas/Money' }
        arr: { $ref: '#/components/schemas/Money' }
        revenue_received: { $ref: '#/components/schemas/Money' }
        outstanding: { $ref: '#/components/schemas/Money' }
        overdue_invoices:
          type: object
          properties:
            count: { type: integer, example: 14 }
            amount: { $ref: '#/components/schemas/Money' }

security:
  - bearerAuth: []
