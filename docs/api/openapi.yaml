openapi: 3.0.3
info:
  title: Subly API (Brightloop Software)
  version: 0.1.0
  description: |
    THE API CONTRACT. Change this file (in its own PR, reviewed by one backend
    and one Flutter dev) BEFORE changing handlers or Flutter repositories.

    Conventions
    - Base path /api/v1, JSON snake_case, dates YYYY-MM-DD, money as strings ("999.00").
    - Every response uses the envelope { success, data, meta?, error? }.
    - Lists accept page, page_size (max 100), sort (e.g. -created_at).
    - Roles are listed in each operation's description; the backend enforces them.

    Status: auth, staff, customers, taxes, products, plans, quotation templates, discounts and price preview are implemented. A few other core endpoints are specified. Every other endpoint
    in the architecture plan is registered in backend/internal/router and returns
    501 until implemented; add its spec here when you start on it.
servers:
  - url: http://localhost:8080/api/v1
    description: Local API (docker compose)
  - url: http://localhost:4010
    description: Prism mock (make mock-api)

tags:
  - name: System
  - name: Auth
  - name: Staff
  - name: Customers
  - name: Taxes
  - name: Products
  - name: Plans
  - name: Quotation templates
  - name: Discounts
  - name: Invoices
  - name: Payments
  - name: Dashboard

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness and database ping
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          database: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Auth]
      summary: Customer self-registration
      description: Public. Creates a user (role customer) and its customer record.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: |
        Public. ALWAYS returns 200 with the same message, whether or not the email is
        registered or active, so it can't be used to discover accounts. The link
        (valid 30 min) goes to FRONTEND_URL/reset-password?token=...  Requesting a new
        link invalidates older ones. In development the email appears in Mailpit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: rahul@example.in }
      responses:
        '200': { $ref: '#/components/responses/Message' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using an emailed token
      description: |
        Public. Used for both forgot-password links and staff invite links.
        The token is single-use. On success every existing session (JWT) of the user is revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 64, maxLength: 64, description: 'from the email link' }
                password: { type: string, example: 'NewPass#2026' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400':
          description: Weak password, or token invalid / expired / already used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example: { success: false, error: { code: VALIDATION_ERROR, message: This reset link is invalid or has expired, details: { token: is invalid or has expired; request a new link } } }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: Any logged-in user. Customers also get `customer_id` and `profile`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      tags: [Auth]
      summary: Update my profile
      description: |
        Any logged-in user. Only fields sent are changed; send "" to clear an optional field.
        Admin/staff may only change full_name. Email cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change my password
      description: |
        Any logged-in user. All other sessions are signed out. The response contains a
        NEW access token; the app must store it and discard the old one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, example: 'Changed#2026' }
      responses:
        '200':
          description: Password changed; fresh token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /staff:
    get:
      tags: [Staff]
      summary: List staff accounts
      description: 'Roles: admin.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: sort, in: query, description: 'created_at | full_name | email | last_login_at, prefix - for descending', schema: { type: string, example: -created_at } }
        - { name: q, in: query, description: 'search name or email', schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Staff' } }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Staff]
      summary: Create a staff account
      description: |
        Roles: admin ("Only the admin can create staff accounts").
        Omit `password` (recommended) and the staff member is emailed a link to set their
        own password (valid 48 h); `invite_sent` tells you whether that email went out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email]
              properties:
                full_name: { type: string, example: Priya Nair }
                email: { type: string, format: email, example: priya@brightloop.in }
                password: { type: string, description: 'optional; must meet the password policy' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          staff: { $ref: '#/components/schemas/Staff' }
                          invite_sent: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Staff]
      summary: Get a staff account
      description: 'Roles: admin. 404 if the id belongs to a customer or admin.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Staff' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Staff]
      summary: Edit a staff account
      description: 'Roles: admin. Only fields sent are changed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                email: { type: string, format: email }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Staff' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/{id}/status:
    patch:
      tags: [Staff]
      summary: Activate or deactivate a staff account
      description: 'Roles: admin. Deactivation is immediate: the staff member''s existing tokens stop working.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean, example: false }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Staff' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      description: 'Roles: admin, staff. Archived customers are not listed.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: sort, in: query, description: 'created_at | name | email | company_name, prefix - for descending', schema: { type: string, example: -created_at } }
        - { name: q, in: query, description: 'search name, email, company or phone', schema: { type: string } }
        - { name: has_login, in: query, description: 'true = has signed up, false = created by staff only', schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Customers]
      summary: Create a customer
      description: |
        Roles: admin, staff. The customer doesn't need a login. If they later sign up with
        the same email, their login is linked to this record automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Customers]
      summary: Customer detail with subscription and invoice counts
      description: 'Roles: admin, staff.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Customers]
      summary: Edit a customer
      description: |
        Roles: admin, staff. Only fields sent are changed; "" clears an optional field.
        The email can't be changed once the customer has a login (it's their login email).
        Renaming a customer with a login also renames their login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Customers]
      summary: Archive a customer
      description: |
        Roles: admin only. Refused (422, rule CUSTOMER_HAS_OPEN_ITEMS) while the customer has
        draft/quotation/confirmed/active/paused subscriptions or unpaid invoices. Archiving hides
        the customer, keeps their invoices and payments, and deactivates their login.
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /taxes:
    get:
      tags: [Taxes]
      summary: List taxes
      description: 'Roles: admin, staff. Default sort: name.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: sort, in: query, description: 'name | rate | created_at, prefix - for descending', schema: { type: string } }
        - { name: q, in: query, description: search by name, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Tax' } }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Taxes]
      summary: Create a tax
      description: 'Roles: admin. Names are unique ignoring case.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, rate]
              properties:
                name: { type: string, minLength: 2, maxLength: 60, example: GST 18% }
                rate: { type: string, description: 'percent, 0-100, max 2 decimals', example: '18.00' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tax' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /taxes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Taxes]
      summary: Get a tax
      description: 'Roles: admin, staff.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tax' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Taxes]
      summary: Edit, deactivate or reactivate a tax
      description: |
        Roles: admin. Only fields sent are changed. A new rate applies to invoices created from
        now on; existing invoice lines keep the rate they were issued with. Deactivating
        (is_active=false) is refused while active products use this tax as their default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                rate: { type: string, example: '12.50' }
                is_active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tax' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
    delete:
      tags: [Taxes]
      summary: Deactivate a tax (never deletes)
      description: 'Roles: admin. 422 with rule TAX_IN_USE while active products use it as their default tax.'
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Tax' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /products:
    get:
      tags: [Products]
      summary: List products (with variants)
      description: 'Roles: admin, staff. Staff get cost_price and margin as null. Archived products are hidden unless status=archived|all.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: sort, in: query, description: 'name | sales_price | created_at, prefix - for descending', schema: { type: string } }
        - { name: q, in: query, description: search name or description, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived, all], default: active } }
        - { name: product_type, in: query, schema: { type: string, enum: [software, service, addon] } }
        - { name: tax_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Products]
      summary: Create a product, optionally with variants
      description: |
        Roles: admin. Names are unique among ACTIVE products (ignoring case). tax_id must be an active tax.
        Each variant's price = sales_price + extra_price (e.g. Odoo Brand: 999 + 560 = 1559).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Products]
      summary: Get a product
      description: 'Roles: admin, staff.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Products]
      summary: Edit, archive or restore a product
      description: |
        Roles: admin. Only fields sent are changed. tax_id 0 removes the default tax.
        status=archived is refused (422 PRODUCT_IN_USE) while an active plan includes the product.
        Changing sales_price updates every plan that contains the product.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
    delete:
      tags: [Products]
      summary: Archive a product (never deletes)
      description: 'Roles: admin. 422 PRODUCT_IN_USE while an active plan includes it.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /products/{id}/variants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Products]
      summary: Add a variant
      description: 'Roles: admin. attribute + name unique per product (ignoring case); SKU unique; variant price may not be negative.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantInput' }
      responses:
        '201':
          description: Created (returns the whole product)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /products/{id}/variants/{vid}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: vid, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [Products]
      summary: Edit, deactivate or reactivate a variant
      description: 'Roles: admin. is_active=false refused (422 VARIANT_IN_USE) while an active plan uses it. A new extra_price updates plans.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }
    delete:
      tags: [Products]
      summary: Deactivate a variant (never deletes)
      description: 'Roles: admin.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /plans:
    get:
      tags: [Plans]
      summary: List plans
      description: |
        Any logged-in user. Customers only get ACTIVE plans available today (filters other than q and
        billing_period are ignored for them) and no active_subscriptions count.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: sort, in: query, description: 'name | price | created_at | available_from', schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived, all], default: active } }
        - { name: billing_period, in: query, schema: { type: string, enum: [daily, weekly, monthly, yearly] } }
        - { name: available_on, in: query, description: 'only plans available on this date', schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Plan' } }
                      meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Plans]
      summary: Create a plan
      description: |
        Roles: admin. The price is NOT sent: it's the sum of the product lines
        (quantity × (price_override or sales_price + variant extra_price)) and is kept up to date when
        lines or catalogue prices change. Names are unique ignoring case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Plans]
      summary: Get a plan
      description: 'Any logged-in user; customers get 404 for plans that are archived or not available today.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Plan' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Plans]
      summary: Edit a plan
      description: |
        Roles: admin. Only fields sent are changed; "products" REPLACES all lines. available_until "" removes the
        end date; auto_close_after_cycles 0 removes it. Changing billing_period/billing_interval is refused
        (422 PLAN_IN_USE) while confirmed/active/paused subscriptions use the plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /plans/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [Plans]
      summary: Archive or reactivate a plan
      description: |
        Roles: admin. Archived plans are hidden from customers and new quotations; existing subscriptions keep billing.
        Reactivating is refused (422 PLAN_HAS_INACTIVE_PRODUCTS) if a line uses an archived product or inactive variant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, archived] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Plan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessRule' }

  /quotation-templates:
