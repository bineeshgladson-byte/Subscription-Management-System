# Air: rebuilds and restarts the API whenever a .go file changes (make dev).
# Runs inside the api-dev container (see Dockerfile.dev and docker-compose.yml).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "tests"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = false
  # Docker bind mounts don't always deliver file events; polling always works.
  poll = true
  poll_interval = 500

[log]
  time = true

[misc]
  clean_on_exit = false
